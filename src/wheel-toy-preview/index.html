<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>幸运转盘 · 课堂点名</title><link rel="stylesheet" href="./style.css"><body><main class="room"><div class="window window-left"></div><div class="window window-right"></div><div class="cloud cloud-one"></div><div class="cloud cloud-two"></div><div class="arch"></div><div class="floor"></div><div class="plant"><i></i><i></i><i></i><b></b></div><div class="books"><i></i><i></i></div><header><h1>幸运转盘<span>✦</span></h1><p>让每一次期待，都闪闪发光</p></header><nav><button id="sound" aria-pressed="true" title="开关音效">♫</button><button id="fullscreen" title="全屏显示">⛶</button></nav><section class="wheel-zone" aria-label="二十格幸运转盘"><div class="wheel-stand"></div><div class="wheel-foot"></div><div class="wheel-shell"><canvas id="wheel" aria-label="二十个趣味短语，最终翻开中选同学"></canvas><div class="hub"><span>★</span></div><div class="pointer"><i></i></div><div class="stud s1"></div><div class="stud s2"></div><div class="stud s3"></div><div class="stud s4"></div><div class="stud s5"></div><div class="stud s6"></div></div></section><section class="result-zone"><div class="sparkles">✦ <span>✦</span></div><div class="result-card"><h2><i></i>本次点名<i></i></h2><div class="result-window"><div id="result" aria-live="polite">等待揭晓</div><p id="result-caption">下一位闪亮登场的，会是谁呢</p></div><div class="result-bottom"><span id="progress">全班公平随机</span><span>★ ★ ★</span></div></div><div id="notice" role="status"></div></section><footer><div class="class-control"><span class="people-icon" aria-hidden="true"><i></i><b></b></span><div><label for="class-select">当前班级</label><select id="class-select" aria-label="选择班级"></select></div></div><div class="main-control"><button id="draw">开始点名<span>开启幸运时刻</span></button></div><div class="timer-control"><span class="clock-icon">◷</span><div><label for="minutes">倒计时</label><select id="minutes" aria-label="倒计时时长"></select></div><button id="timer" title="开始或重新计时">开始</button></div></footer><aside><div class="repeat-modes" aria-label="点名方式"><button id="allow-repeat" aria-pressed="false">允许重复</button><button id="no-repeat" aria-pressed="true">不重复</button></div><span id="sample-note">示例名单 · 仅保存在本机</span><a href="/orbit-preview/">管理班级</a></aside></main><script type="module" src="./app.js"></script></body></html>
