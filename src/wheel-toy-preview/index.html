<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>幸运转盘 · 课堂点名</title><link rel="stylesheet" href="./style.css"><link rel="stylesheet" href="./shared-controls.css"><body><main class="room"><div class="window window-left"></div><div class="window window-right"></div><div class="cloud cloud-one"></div><div class="cloud cloud-two"></div><div class="arch"></div><div class="floor"></div><div class="plant"><i></i><i></i><i></i><b></b></div><div class="books"><i></i><i></i></div><header><h1>幸运转盘<span>✦</span></h1><p>让每一次期待，都闪闪发光</p></header><section class="wheel-zone" aria-label="二十格幸运转盘"><div class="wheel-shell"><canvas id="wheel" aria-label="二十个趣味短语，最终翻开中选同学"></canvas><div class="hub"><span>★</span></div><div class="pointer"><i></i></div><div class="stud s1"></div><div class="stud s2"></div><div class="stud s3"></div><div class="stud s4"></div><div class="stud s5"></div><div class="stud s6"></div></div></section><section class="result-zone"><div class="sparkles">✦ <span>✦</span></div><div class="result-card"><h2><i></i>本次点名<i></i></h2><div class="result-window"><div id="winner" aria-live="polite">等待揭晓</div><p id="result-caption">下一位闪亮登场的，会是谁呢</p></div><div class="result-bottom"><span id="progress">全班公平随机</span><span>★ ★ ★</span></div></div><div id="notice" role="status"></div></section></main><div class="shared-controls"><footer>
 <div class="main-controls">
  <div id="result" aria-live="polite"><span class="result-tag" id="class-label">示例班级</span><strong id="footer-result">把讲台交给下一位</strong><span id="speech-status" hidden></span></div>
  <div class="primary-actions">
   <button id="pick"><span>开始点名</span></button>
   <div class="inline-timer"><div class="inline-timer-main"><button id="timer-primary"><strong id="timer-action-label">倒计时</strong><span id="timer-mini"></span></button></div></div>
  </div>
 </div>
 <div class="bottom-toolbar">
  <div class="theme-choices" role="radiogroup" aria-label="界面主题"><button type="button" role="radio" aria-checked="false" tabindex="-1" data-theme-choice="classroom">晴窗教室</button><button type="button" role="radio" aria-checked="false" tabindex="-1" data-theme-choice="space">星空卡片</button><button type="button" role="radio" aria-checked="false" tabindex="-1" data-theme-choice="paper">翻牌点名</button><button type="button" role="radio" aria-checked="true" tabindex="0" data-theme-choice="wheel">幸运转盘</button></div>
  <button id="edit" class="toolbar-button">班级与座位</button>

  <div class="repeat-mode" role="group" aria-label="点名重复模式"><button type="button" id="repeat-allow" data-no-repeat="false" aria-pressed="false">允许重复</button><button type="button" id="repeat-once" data-no-repeat="true" aria-pressed="true">不重复点名</button></div>
  <div class="duration-control"><label id="timer-minutes-label" for="timer-minutes">计时时长</label><select id="timer-minutes" aria-labelledby="timer-minutes-label"><option value="1">1 分钟</option><option value="2" selected>2 分钟</option><option value="3">3 分钟</option><option value="4">4 分钟</option><option value="5">5 分钟</option><option value="6">6 分钟</option><option value="7">7 分钟</option><option value="8">8 分钟</option><option value="9">9 分钟</option><option value="10">10 分钟</option></select></div>
  <button id="sound-toggle" title="控制点名音效、姓名播报和倒计时提示音；姓名使用本机中文语音，多音字读音可能不准" class="toolbar-button" aria-pressed="true">♪ 音效开</button>
  <button id="fullscreen" class="toolbar-button">⛶ 全屏</button>
 </div>
</footer></div><dialog id="class-dialog"><h2>选择班级</h2><label for="class-select">当前班级</label><select id="class-select" aria-label="切换班级"></select><p id="sample-note">示例名单 · 仅保存在本机</p><a href="/orbit-preview/">管理班级与座位</a><button id="class-close">完成</button></dialog><script type="module" src="./app.js"></script></body></html>
