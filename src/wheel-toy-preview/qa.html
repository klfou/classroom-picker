<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>转盘响应式尺寸验证</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#d5e7f4}iframe{position:absolute;border:0;transform-origin:top left}</style><iframe title="指定尺寸的实际转盘页面" src="./index.html"></iframe><script>const wide=new URLSearchParams(location.search).get('size')==='1920';const w=wide?1920:1366,h=wide?1080:768,frame=document.querySelector('iframe');frame.width=w;frame.height=h;function fit(){const scale=Math.min(innerWidth/w,innerHeight/h);frame.style.transform=`scale(${scale})`;frame.style.left=`${(innerWidth-w*scale)/2}px`;frame.style.top=`${(innerHeight-h*scale)/2}px`}addEventListener('resize',fit);fit();</script></html>
